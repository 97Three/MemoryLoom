name: memoryloom

# Production-pilot hardening overlay. It deliberately contains no defaults for
# identity, database, object-storage, or pseudonymization secrets. Compose must
# fail during interpolation instead of silently falling back to local values.
services:
  postgres:
    environment:
      POSTGRES_DB: ${MEMORYLOOM_POSTGRES_DB:?set MEMORYLOOM_POSTGRES_DB}
      POSTGRES_USER: ${MEMORYLOOM_POSTGRES_USER:?set MEMORYLOOM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MEMORYLOOM_POSTGRES_PASSWORD:?set MEMORYLOOM_POSTGRES_PASSWORD}

  minio:
    environment:
      MINIO_ROOT_USER: ${MEMORYLOOM_MINIO_ROOT_USER:?set MEMORYLOOM_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MEMORYLOOM_MINIO_ROOT_PASSWORD:?set MEMORYLOOM_MINIO_ROOT_PASSWORD}

  milvus:
    environment:
      MINIO_ACCESS_KEY_ID: ${MEMORYLOOM_MINIO_ROOT_USER:?set MEMORYLOOM_MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MEMORYLOOM_MINIO_ROOT_PASSWORD:?set MEMORYLOOM_MINIO_ROOT_PASSWORD}

  migrate:
    environment:
      MEMORYLOOM_STORE: postgres
      MEMORYLOOM_DATABASE_URL: ${MEMORYLOOM_DATABASE_URL:?set MEMORYLOOM_DATABASE_URL}

  backend:
    environment:
      MEMORYLOOM_ENVIRONMENT: production
      MEMORYLOOM_STORE: postgres
      MEMORYLOOM_DATABASE_URL: ${MEMORYLOOM_DATABASE_URL:?set MEMORYLOOM_DATABASE_URL}
      MEMORYLOOM_AUTH_MODE: jwt
      MEMORYLOOM_AUTH_JWT_ISSUER: ${MEMORYLOOM_AUTH_JWT_ISSUER:?set an HTTPS issuer}
      MEMORYLOOM_AUTH_JWT_AUDIENCE: ${MEMORYLOOM_AUTH_JWT_AUDIENCE:?set MEMORYLOOM_AUTH_JWT_AUDIENCE}
      MEMORYLOOM_AUTH_JWT_JWKS_URL: ${MEMORYLOOM_AUTH_JWT_JWKS_URL:?set an HTTPS JWKS URL}
      MEMORYLOOM_AUTH_JWT_ALGORITHMS: ${MEMORYLOOM_AUTH_JWT_ALGORITHMS:-RS256}
      MEMORYLOOM_AUTH_REQUIRED_SCOPE: ${MEMORYLOOM_AUTH_REQUIRED_SCOPE:-memory}
      MEMORYLOOM_AUTH_AUDIT_SINK: postgres
      MEMORYLOOM_AUTH_AUDIT_HMAC_KEY: ${MEMORYLOOM_AUTH_AUDIT_HMAC_KEY:?set a separate 32+ character secret}
      MEMORYLOOM_GOVERNANCE_MODE: postgres
      MEMORYLOOM_GOVERNANCE_HMAC_KEY: ${MEMORYLOOM_GOVERNANCE_HMAC_KEY:?set a separate 32+ character secret}
      MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID: ${MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID:?set a rotation key ID}
      MEMORYLOOM_PRIVACY_POLICY_VERSION: ${MEMORYLOOM_PRIVACY_POLICY_VERSION:?set a policy version}
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:?set the public HTTPS API URL}
      MEMORYLOOM_FRONTEND_URL: ${MEMORYLOOM_FRONTEND_URL:?set the public HTTPS frontend URL}
      MEMORYLOOM_CORS_ORIGINS: ${MEMORYLOOM_CORS_ORIGINS:?set exact HTTPS origins}
      MEMORYLOOM_PROJECTION_REQUIRED: "true"

  projector:
    environment:
      MEMORYLOOM_ENVIRONMENT: production
      MEMORYLOOM_STORE: postgres
      MEMORYLOOM_DATABASE_URL: ${MEMORYLOOM_DATABASE_URL:?set MEMORYLOOM_DATABASE_URL}
      MEMORYLOOM_AUTH_MODE: jwt
      MEMORYLOOM_AUTH_JWT_ISSUER: ${MEMORYLOOM_AUTH_JWT_ISSUER:?set an HTTPS issuer}
      MEMORYLOOM_AUTH_JWT_AUDIENCE: ${MEMORYLOOM_AUTH_JWT_AUDIENCE:?set MEMORYLOOM_AUTH_JWT_AUDIENCE}
      MEMORYLOOM_AUTH_JWT_JWKS_URL: ${MEMORYLOOM_AUTH_JWT_JWKS_URL:?set an HTTPS JWKS URL}
      MEMORYLOOM_AUTH_JWT_ALGORITHMS: ${MEMORYLOOM_AUTH_JWT_ALGORITHMS:-RS256}
      MEMORYLOOM_AUTH_REQUIRED_SCOPE: ${MEMORYLOOM_AUTH_REQUIRED_SCOPE:-memory}
      MEMORYLOOM_AUTH_AUDIT_SINK: postgres
      MEMORYLOOM_AUTH_AUDIT_HMAC_KEY: ${MEMORYLOOM_AUTH_AUDIT_HMAC_KEY:?set a separate 32+ character secret}
      MEMORYLOOM_GOVERNANCE_MODE: postgres
      MEMORYLOOM_GOVERNANCE_HMAC_KEY: ${MEMORYLOOM_GOVERNANCE_HMAC_KEY:?set a separate 32+ character secret}
      MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID: ${MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID:?set a rotation key ID}
      MEMORYLOOM_PRIVACY_POLICY_VERSION: ${MEMORYLOOM_PRIVACY_POLICY_VERSION:?set a policy version}
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:?set the public HTTPS API URL}
      MEMORYLOOM_FRONTEND_URL: ${MEMORYLOOM_FRONTEND_URL:?set the public HTTPS frontend URL}
      MEMORYLOOM_CORS_ORIGINS: ${MEMORYLOOM_CORS_ORIGINS:?set exact HTTPS origins}
      MEMORYLOOM_PROJECTION_REQUIRED: "true"

  frontend:
    environment:
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:?set the public HTTPS API URL}
