name: memoryloom-memory

# Explicit ephemeral alternative to the default PostgreSQL Compose stack.
# Use: docker compose -f compose.memory.yaml up --build -d

x-app: &app
  build:
    context: .
  image: memoryloom:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  backend:
    <<: *app
    environment:
      MEMORYLOOM_ENVIRONMENT: development
      MEMORYLOOM_HOST: 0.0.0.0
      MEMORYLOOM_PORT: "38089"
      MEMORYLOOM_LOG_LEVEL: INFO
      MEMORYLOOM_AUTH_MODE: development
      MEMORYLOOM_FRONTEND_URL: ${MEMORYLOOM_FRONTEND_URL:-http://127.0.0.1:33009}
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:-http://127.0.0.1:38089}
      MEMORYLOOM_CORS_ORIGINS: ${MEMORYLOOM_CORS_ORIGINS:-http://127.0.0.1:33009,http://localhost:33009}
      MEMORYLOOM_STORE: memory
      MEMORYLOOM_PROJECTION_MODE: disabled
      MEMORYLOOM_DATABASE_READINESS_TIMEOUT_SECONDS: ${MEMORYLOOM_DATABASE_READINESS_TIMEOUT_SECONDS:-1.0}
    ports:
      - "127.0.0.1:38089:38089"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:38089/readyz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    <<: *app
    command: ["memoryloom-frontend"]
    environment:
      MEMORYLOOM_FRONTEND_HOST: 0.0.0.0
      MEMORYLOOM_FRONTEND_PORT: "33009"
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:-http://127.0.0.1:38089}
    ports:
      - "127.0.0.1:33009:33009"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:33009/', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
