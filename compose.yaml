name: memoryloom

# Local-development credentials only. Do not reuse them outside this isolated
# Compose network. PostgreSQL is not published to the host.

x-database-url: &database-url postgresql://memoryloom:memoryloom-local-only@postgres:5432/memoryloom

x-projection-environment: &projection-environment
  MEMORYLOOM_PROJECTION_MODE: milvus
  MEMORYLOOM_PROJECTION_REQUIRED: ${MEMORYLOOM_PROJECTION_REQUIRED:-false}
  MEMORYLOOM_PROJECTION_NAME: ${MEMORYLOOM_PROJECTION_NAME:-milvus-memory-v1}
  MEMORYLOOM_PROJECTION_SEARCH_OVERSAMPLE: ${MEMORYLOOM_PROJECTION_SEARCH_OVERSAMPLE:-10}
  MEMORYLOOM_MILVUS_URI: http://milvus:19530
  MEMORYLOOM_MILVUS_TOKEN: ${MEMORYLOOM_MILVUS_TOKEN:-}
  MEMORYLOOM_MILVUS_COLLECTION: ${MEMORYLOOM_MILVUS_COLLECTION:-memoryloom_v1}
  MEMORYLOOM_MILVUS_CONSISTENCY_LEVEL: ${MEMORYLOOM_MILVUS_CONSISTENCY_LEVEL:-Bounded}
  MEMORYLOOM_MILVUS_TIMEOUT_SECONDS: ${MEMORYLOOM_MILVUS_TIMEOUT_SECONDS:-5.0}
  MEMORYLOOM_MILVUS_MIN_SIMILARITY: ${MEMORYLOOM_MILVUS_MIN_SIMILARITY:-0.15}
  MEMORYLOOM_EMBEDDING_PROVIDER: ${MEMORYLOOM_EMBEDDING_PROVIDER:-hash}
  MEMORYLOOM_EMBEDDING_MODEL: ${MEMORYLOOM_EMBEDDING_MODEL:-hash-blake2b-v1}
  MEMORYLOOM_EMBEDDING_DIMENSIONS: ${MEMORYLOOM_EMBEDDING_DIMENSIONS:-384}
  MEMORYLOOM_EMBEDDING_BASE_URL: ${MEMORYLOOM_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
  MEMORYLOOM_EMBEDDING_API_KEY: ${MEMORYLOOM_EMBEDDING_API_KEY:-}
  MEMORYLOOM_EMBEDDING_TIMEOUT_SECONDS: ${MEMORYLOOM_EMBEDDING_TIMEOUT_SECONDS:-15.0}

x-app: &app
  build:
    context: .
  image: memoryloom:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local-only
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin-local-only
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:19091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memoryloom
      POSTGRES_USER: memoryloom
      POSTGRES_PASSWORD: memoryloom-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["memoryloom-migrate"]
    environment:
      MEMORYLOOM_STORE: postgres
      MEMORYLOOM_DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *app
    environment:
      <<: *projection-environment
      MEMORYLOOM_ENVIRONMENT: ${MEMORYLOOM_ENVIRONMENT:-development}
      MEMORYLOOM_HOST: 0.0.0.0
      MEMORYLOOM_PORT: "38089"
      MEMORYLOOM_LOG_LEVEL: INFO
      MEMORYLOOM_AUTH_MODE: ${MEMORYLOOM_AUTH_MODE:-development}
      MEMORYLOOM_AUTH_JWT_ISSUER: ${MEMORYLOOM_AUTH_JWT_ISSUER:-}
      MEMORYLOOM_AUTH_JWT_AUDIENCE: ${MEMORYLOOM_AUTH_JWT_AUDIENCE:-}
      MEMORYLOOM_AUTH_JWT_JWKS_URL: ${MEMORYLOOM_AUTH_JWT_JWKS_URL:-}
      MEMORYLOOM_AUTH_JWT_ALGORITHMS: ${MEMORYLOOM_AUTH_JWT_ALGORITHMS:-RS256}
      MEMORYLOOM_AUTH_REQUIRED_SCOPE: ${MEMORYLOOM_AUTH_REQUIRED_SCOPE:-memory}
      MEMORYLOOM_AUTH_AUDIT_SINK: ${MEMORYLOOM_AUTH_AUDIT_SINK:-log}
      MEMORYLOOM_AUTH_AUDIT_HMAC_KEY: ${MEMORYLOOM_AUTH_AUDIT_HMAC_KEY:-}
      MEMORYLOOM_GOVERNANCE_MODE: ${MEMORYLOOM_GOVERNANCE_MODE:-development}
      MEMORYLOOM_GOVERNANCE_HMAC_KEY: ${MEMORYLOOM_GOVERNANCE_HMAC_KEY:-}
      MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID: ${MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID:-governance-v1}
      MEMORYLOOM_PRIVACY_POLICY_VERSION: ${MEMORYLOOM_PRIVACY_POLICY_VERSION:-privacy-v1}
      MEMORYLOOM_FRONTEND_URL: ${MEMORYLOOM_FRONTEND_URL:-http://127.0.0.1:33009}
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:-http://127.0.0.1:38089}
      MEMORYLOOM_CORS_ORIGINS: ${MEMORYLOOM_CORS_ORIGINS:-http://127.0.0.1:33009,http://localhost:33009}
      MEMORYLOOM_STORE: postgres
      MEMORYLOOM_DATABASE_URL: *database-url
      MEMORYLOOM_DATABASE_POOL_MIN_SIZE: "1"
      MEMORYLOOM_DATABASE_POOL_MAX_SIZE: "10"
      MEMORYLOOM_DATABASE_READINESS_TIMEOUT_SECONDS: ${MEMORYLOOM_DATABASE_READINESS_TIMEOUT_SECONDS:-1.0}
    ports:
      - "127.0.0.1:38089:38089"
    depends_on:
      migrate:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:38089/readyz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  projector:
    <<: *app
    command: ["memoryloom-projector", "run"]
    environment:
      <<: *projection-environment
      MEMORYLOOM_ENVIRONMENT: ${MEMORYLOOM_ENVIRONMENT:-development}
      MEMORYLOOM_LOG_LEVEL: INFO
      MEMORYLOOM_AUTH_MODE: ${MEMORYLOOM_AUTH_MODE:-development}
      MEMORYLOOM_AUTH_JWT_ISSUER: ${MEMORYLOOM_AUTH_JWT_ISSUER:-}
      MEMORYLOOM_AUTH_JWT_AUDIENCE: ${MEMORYLOOM_AUTH_JWT_AUDIENCE:-}
      MEMORYLOOM_AUTH_JWT_JWKS_URL: ${MEMORYLOOM_AUTH_JWT_JWKS_URL:-}
      MEMORYLOOM_AUTH_JWT_ALGORITHMS: ${MEMORYLOOM_AUTH_JWT_ALGORITHMS:-RS256}
      MEMORYLOOM_AUTH_REQUIRED_SCOPE: ${MEMORYLOOM_AUTH_REQUIRED_SCOPE:-memory}
      MEMORYLOOM_AUTH_AUDIT_SINK: ${MEMORYLOOM_AUTH_AUDIT_SINK:-log}
      MEMORYLOOM_AUTH_AUDIT_HMAC_KEY: ${MEMORYLOOM_AUTH_AUDIT_HMAC_KEY:-}
      MEMORYLOOM_GOVERNANCE_MODE: ${MEMORYLOOM_GOVERNANCE_MODE:-development}
      MEMORYLOOM_GOVERNANCE_HMAC_KEY: ${MEMORYLOOM_GOVERNANCE_HMAC_KEY:-}
      MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID: ${MEMORYLOOM_GOVERNANCE_PSEUDONYM_KEY_ID:-governance-v1}
      MEMORYLOOM_PRIVACY_POLICY_VERSION: ${MEMORYLOOM_PRIVACY_POLICY_VERSION:-privacy-v1}
      MEMORYLOOM_STORE: postgres
      MEMORYLOOM_DATABASE_URL: *database-url
      MEMORYLOOM_DATABASE_POOL_MAX_SIZE: "4"
      MEMORYLOOM_DATABASE_READINESS_TIMEOUT_SECONDS: ${MEMORYLOOM_DATABASE_READINESS_TIMEOUT_SECONDS:-1.0}
      MEMORYLOOM_PROJECTION_WORKER_BATCH_SIZE: ${MEMORYLOOM_PROJECTION_WORKER_BATCH_SIZE:-64}
      MEMORYLOOM_PROJECTION_WORKER_LEASE_SECONDS: ${MEMORYLOOM_PROJECTION_WORKER_LEASE_SECONDS:-60.0}
      MEMORYLOOM_PROJECTION_WORKER_POLL_SECONDS: ${MEMORYLOOM_PROJECTION_WORKER_POLL_SECONDS:-1.0}
      MEMORYLOOM_PROJECTION_WORKER_RETRY_BASE_SECONDS: ${MEMORYLOOM_PROJECTION_WORKER_RETRY_BASE_SECONDS:-2.0}
      MEMORYLOOM_PROJECTION_WORKER_RETRY_MAX_SECONDS: ${MEMORYLOOM_PROJECTION_WORKER_RETRY_MAX_SECONDS:-300.0}
      MEMORYLOOM_PROJECTION_WORKER_MAX_ATTEMPTS: ${MEMORYLOOM_PROJECTION_WORKER_MAX_ATTEMPTS:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memoryloom-projector", "check"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    <<: *app
    command: ["memoryloom-frontend"]
    environment:
      MEMORYLOOM_FRONTEND_HOST: 0.0.0.0
      MEMORYLOOM_FRONTEND_PORT: "33009"
      MEMORYLOOM_PUBLIC_API_URL: ${MEMORYLOOM_PUBLIC_API_URL:-http://127.0.0.1:38089}
    ports:
      - "127.0.0.1:33009:33009"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:33009/', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  postgres-data:
